<!doctype html>
<meta charset="utf-8">
<title>three2unity preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; font: 12px/1.4 ui-monospace, monospace; color: #cfd6e6; }
  canvas { display: block; }
  #hud { position: fixed; left: 10px; top: 8px; background: rgba(8, 11, 22, .8); padding: 6px 10px; border-radius: 6px; }
  button { font: inherit; margin-left: 8px; }
</style>
<div id="hud">loading…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
// Replays what the exporter captured (scene.glb + scene.json) in plain three.js: no Unity needed. This is the export, not
// Unity's rendering: Unity will shade materials and lights its own way.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const hud = document.getElementById('hud'), d = await (await fetch('data/scene.json')).json();
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(devicePixelRatio); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(d.camera.fov || 50, 1, d.camera.near || 1, d.camera.far || 3000);
if (d.background) scene.background = new THREE.Color(d.background);
if (d.fog.on) scene.fog = d.fog.exp ? new THREE.FogExp2(d.fog.color, d.fog.density) : new THREE.Fog(d.fog.color, d.fog.near, d.fog.far);
for (const L of d.lights) {
  let l;
  if (L.type === 'HemisphereLight') l = new THREE.HemisphereLight(L.color, L.ground, L.intensity);
  else if (L.type === 'AmbientLight') l = new THREE.AmbientLight(L.color, L.intensity);
  else if (L.type === 'DirectionalLight') { l = new THREE.DirectionalLight(L.color, L.intensity); l.target.position.set(...L.pos.map((v, i) => v + L.dir[i])); scene.add(l.target); }
  else if (L.type === 'PointLight') l = new THREE.PointLight(L.color, L.intensity, L.distance);
  else if (L.type === 'SpotLight') { l = new THREE.SpotLight(L.color, L.intensity, L.distance, L.angle * Math.PI / 180, L.penumbra); l.target.position.set(...L.pos.map((v, i) => v + L.dir[i])); scene.add(l.target); }
  if (!l) continue; l.position.set(...L.pos); scene.add(l);
}
const gltf = await new GLTFLoader().loadAsync('data/scene.glb'); scene.add(gltf.scene);
// GLTFLoader renames repeated node names (Group -> Group_2_1) but keeps the file's name in userData.name.
const find = p => p.split('/').reduce((o, n) => o && o.children.find(c => c.userData.name === n), gltf.scene);
for (const h of d.hidden) { const o = find(h); if (o) o.visible = false; }

const c = d.camera; if (c.on) { cam.position.set(...c.pos); cam.quaternion.set(...c.rot); }
const controls = new OrbitControls(cam, renderer.domElement); controls.enabled = false;
const clip = d.clips[0], tracks = clip ? clip.tracks.map(t => ({ ...t, o: find(t.path) })).filter(t => t.o) : [];
const T = clip ? clip.times : [], dur = T.length ? T[T.length - 1] : 0, q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion();
let free = !clip, t0 = performance.now();
const at = (arr, n, i, a, k) => arr[i * n + k] + (arr[(i + 1) * n + k] - arr[i * n + k]) * a;
function play(t) {
  let i = 0; while (i < T.length - 2 && T[i + 1] <= t) i++;
  const a = Math.min(1, Math.max(0, (t - T[i]) / ((T[i + 1] - T[i]) || 1)));
  for (const k of tracks) {
    if (k.p.length) k.o.position.set(at(k.p, 3, i, a, 0), at(k.p, 3, i, a, 1), at(k.p, 3, i, a, 2));
    if (k.r.length) { q0.fromArray(k.r, i * 4); q1.fromArray(k.r, (i + 1) * 4); k.o.quaternion.copy(q0.slerp(q1, a)); }
    if (k.s.length) k.o.scale.set(at(k.s, 3, i, a, 0), at(k.s, 3, i, a, 1), at(k.s, 3, i, a, 2));
    if (k.v.length) k.o.visible = k.v[i] > 0.5;
  }
  const K = clip.camera; if (K && K.on && !free) {
    cam.position.set(at(K.p, 3, i, a, 0), at(K.p, 3, i, a, 1), at(K.p, 3, i, a, 2));
    q0.fromArray(K.r, i * 4); q1.fromArray(K.r, (i + 1) * 4); cam.quaternion.copy(q0.slerp(q1, a));
    cam.fov = K.fov[i] + (K.fov[i + 1] - K.fov[i]) * a; cam.updateProjectionMatrix();
  }
}
function resize() { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const info = `${gltf.scene.children.length} roots · ${d.lights.length} lights` + (clip ? ` · ${tracks.length} moving nodes, ${dur.toFixed(1)} s` : '');
function label() { hud.innerHTML = `${info}<button id="fc">${free ? 'follow recorded camera' : 'free camera (drag / wheel)'}</button>`; document.getElementById('fc').onclick = () => { free = !free; controls.enabled = free; if (free) controls.target.set(cam.position.x, 0, cam.position.z - 200); label(); }; }
label();
renderer.setAnimationLoop(() => { if (dur) play(((performance.now() - t0) / 1000) % dur); if (free) controls.update(); renderer.render(scene, cam); });
</script>
