name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Client scripts parse
        working-directory: .
        run: node --check online.js

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: blaze-duel-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: blaze-duel-server:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Smoke test the container
        run: |
          docker run -d --name s -p 8080:8080 blaze-duel-server:ci
          for i in $(seq 1 15); do curl -fs localhost:8080/healthz && exit 0; sleep 1; done
          docker logs s; exit 1
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}/duel-server
          docker tag blaze-duel-server:ci $IMG:${GITHUB_SHA} && docker tag blaze-duel-server:ci $IMG:latest
          docker push $IMG:${GITHUB_SHA} && docker push $IMG:latest

  deploy:
    # Enable by setting repository variable DEPLOY_FLY=true and secret FLY_API_TOKEN.
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_FLY == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config server/fly.toml --dockerfile server/Dockerfile server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Post-deploy health check (fails the job if the new release is unhealthy)
        run: |
          for i in $(seq 1 20); do curl -fs https://blaze-duel.fly.dev/healthz && exit 0; sleep 3; done
          exit 1
