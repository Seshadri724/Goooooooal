name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Client scripts parse
        working-directory: .
        run: node --check online.js

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: blaze-duel-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (fail on HIGH/CRITICAL)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0
          image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed blaze-duel-server:ci
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:8080 blaze-duel-server:ci
          for i in $(seq 1 15); do curl -fs localhost:8080/healthz && exit 0; sleep 1; done
          docker logs smoke; exit 1
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}/duel-server
          docker tag blaze-duel-server:ci $IMG:${GITHUB_SHA} && docker tag blaze-duel-server:ci $IMG:latest
          docker push $IMG:${GITHUB_SHA} && docker push $IMG:latest

  deploy:
    # Render (free plan). Enable with: secret RENDER_DEPLOY_HOOK_URL, variables RENDER_URL (https://<service>.onrender.com) and DEPLOY_RENDER=true.
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_RENDER == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    timeout-minutes: 20
    steps:
      - name: Trigger Render deploy of this exact commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]')" # pasted secrets often carry a trailing newline
          case "$HOOK" in https://api.render.com/deploy/srv-*\?key=*) ;; *)
            echo "::error::RENDER_DEPLOY_HOOK_URL should look like https://api.render.com/deploy/srv-...?key=... (copy it from blaze-duel > Settings > Deploy Hook)"; exit 1;; esac
          echo "service: $(printf '%s' "$HOOK" | sed -E 's|.*/deploy/(srv-[a-z0-9]+).*|\1|')" # the key is never printed
          post() { code=$(curl -sS -o /tmp/r.txt -w '%{http_code}' -X POST "$1"); echo "HTTP $code: $(head -c 300 /tmp/r.txt)"; } # Render's reply is an error text or deploy id, never the key
          echo -n "deploy ${GITHUB_SHA}: "; post "${HOOK}&ref=${GITHUB_SHA}"
          [ "$code" -lt 300 ] && exit 0
          echo -n "deploy the service branch's latest commit: "; post "$HOOK"
          [ "$code" -lt 300 ] && { echo "::warning::Render could not use commit ${GITHUB_SHA} (repo link out of date?); deployed the branch's latest commit instead"; exit 0; }
          case "$code" in
            404) echo "::error::Render does not recognise this hook: wrong service ID or key. Copy blaze-duel > Settings > Deploy Hook again." ;;
            *)   echo "::error::Render accepted the hook but refused the deploy (HTTP $code, reason above). Check blaze-duel > Events and that Render's GitHub app can still access this repo." ;;
          esac
          exit 1
      - name: Wait until the new release is live (fails the job if it never reports this commit)
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          # Free-plan builds plus a cold start take a few minutes; give it up to 15.
          for i in $(seq 1 90); do
            if curl -fs --max-time 70 "$URL/healthz" | grep -q "\"version\":\"${GITHUB_SHA}\""; then echo "live: ${GITHUB_SHA}"; exit 0; fi
            sleep 10
          done
          echo "Render never reported ${GITHUB_SHA} on /healthz"; curl -s "$URL/healthz"; exit 1
