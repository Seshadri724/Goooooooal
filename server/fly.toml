# Fly.io config for the room server. Rooms live in memory, so run exactly one machine
# (ponytail: scale-out needs a shared room store such as Redis, or region-pinned rooms).
app = "blaze-duel"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Lock WebSocket upgrades to the site that hosts the game; set to your GitHub Pages origin.
  ALLOWED_ORIGINS = "https://seshadri724.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
